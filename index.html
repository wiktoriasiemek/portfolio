<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiktoria Siemek - Wizytówka</title>
    <style>
        
        .card-container {
    position: relative;
    width: 95vw; 
    max-width: 710px; 
    line-height: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

@media (min-width: 768px) {
    .card-container {
        width: 71%; 
    }
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #e0e0e0;
    overflow-x: hidden; 
}
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            font-family: sans-serif;
        }

        .card-container {
            position: relative;
            width: 90%; 
            max-width: 710px; 
            line-height: 0;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .card-container {
                width: 71%;
            }
        }

        .card-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .invisible-button {
            position: absolute;
            left: 7.8%;      
            bottom: 19.3%;   
            width: 41.5%;    
            height: 9.3%;    
            background: rgba(255, 0, 0, 0); 
            cursor: pointer;
            border-radius: 50px; 
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .invisible-button:hover {
            background: rgba(255, 255, 255, 0.1); 
        }

        @media (max-width: 480px) {
            .card-container {
                width: 95%; 
                box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <img src="PORTFOLIO.png" alt="Wiktoria Siemek - Studentka Informatyki i Projektantka">

        <a href="https://www.behance.net/wiktoriasiemek" class="invisible-button" target="_blank" title="Zobacz moje projekty"></a>
    </div>

</body>
</html>
