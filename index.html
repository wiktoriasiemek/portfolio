<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiktoria Siemek - Portfolio</title>
    <style>
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-container {
    position: relative;
    width: 75%; /* Ustawienie szerokości na 75% szerokości ekranu */
    max-width: 750px; /* Zmniejszenie max-width z 1000px na 750px (czyli 75%) */
    line-height: 0;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    transition: all 0.3s ease; /* Płynne skalowanie */
}
    </style>
</head>
<body>
    <!-- Wyświetla Twój PDF na pełnym ekranie -->
    <iframe src="PORTFOLIO.pdf"></iframe>
</body>
</html>
